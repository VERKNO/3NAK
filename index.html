<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chut</title>
<meta name="description" content="Batak home cooking and baking, adapted for ingredients in Prague.">
<meta name="theme-color" content="#8A2D52">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chut">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: recipe index on the left, open recipe card on the right; stacks to one column on phones */
:root {
  --bg: #F3F5F1;
  --surface: #FFFFFF;
  --fg: #1C221E;
  --muted: #5F6A63;
  --line: #D9DFD8;
  --accent: #8A2D52;       /* candied-cherry red */
  --accent-soft: #F4E3EA;
  --warn: #8A5A00;
  --warn-soft: #FFF2D6;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131714; --surface: #1B201C; --fg: #E8ECE7; --muted: #9AA59D; --line: #2D352F;
  --accent: #EC93B5; --accent-soft: #3A2230; --warn: #F2C46B; --warn-soft: #3A2F17; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131714; --surface: #1B201C; --fg: #E8ECE7; --muted: #9AA59D; --line: #2D352F;
  --accent: #EC93B5; --accent-soft: #3A2230; --warn: #F2C46B; --warn-soft: #3A2F17; color-scheme: dark; }

body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 22px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -0.02em; margin: 0; }
.sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
.grid { display: grid; grid-template-columns: 300px 1fr; gap: 28px; align-items: start; }
@media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }

.index { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.search { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); }
.search:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 2px; }
.item { all: unset; cursor: pointer; display: grid; gap: 2px; padding: 10px 12px; border-radius: 8px; }
.item:hover { background: var(--surface); }
.item[aria-current="true"] { background: var(--accent-soft); }
.item .t { font-weight: 600; }
.item .m { font-size: 0.85rem; color: var(--muted); }
.empty { color: var(--muted); font-size: 0.95rem; padding: 10px 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(18px, 3vw, 32px); min-width: 0; }
.card h2 { font-family: var(--display); font-weight: 700; font-size: clamp(1.5rem, 3vw, 2rem); letter-spacing: -0.015em; line-height: 1.15; margin: 4px 0 6px; text-wrap: balance; }
.desc { color: var(--muted); margin: 0 0 18px; max-width: 62ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.chip { font-size: 0.85rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.chip.oven { background: var(--warn-soft); border-color: transparent; color: var(--warn); font-weight: 600; }
.cols { display: grid; grid-template-columns: minmax(220px, 1fr) 2fr; gap: 32px; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
.cols > section { min-width: 0; }
h3 { font-family: var(--display); font-weight: 500; font-size: 1.15rem; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.serv { display: inline-flex; align-items: center; gap: 6px; font-family: var(--body); font-size: 0.9rem; color: var(--muted); }
.serv button { all: unset; cursor: pointer; width: 26px; height: 26px; text-align: center; line-height: 26px; border-radius: 6px; border: 1px solid var(--line); color: var(--fg); }
.serv button:hover { border-color: var(--accent); color: var(--accent); }
.serv output { font-family: var(--mono); color: var(--fg); min-width: 2ch; text-align: center; }
ul.ing { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
ul.ing li { display: grid; grid-template-columns: 7.5ch 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
ul.ing .q { font-family: var(--mono); font-size: 0.9rem; font-variant-numeric: tabular-nums; text-align: right; color: var(--accent); }
ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
ol.steps li::before { content: counter(s); font-family: var(--mono); font-size: 0.85rem; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
ol.steps b { display: block; }
.notes { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
.notes ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; color: var(--muted); max-width: 70ch; }
.tips { margin-top: 28px; }
.tips .card { padding: 20px 24px; }
.tiplist { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 28px; }
.tiplist b { display: block; font-weight: 600; }
.tiplist span { color: var(--muted); font-size: 0.95rem; }
.back { all: unset; cursor: pointer; color: var(--accent); font-size: 0.9rem; display: none; margin-bottom: 8px; }
@media (max-width: 780px) {
  .grid.open .index { display: none; }
  .grid:not(.open) .detail { display: none; }
  .back { display: inline-block; }
}
.headr { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.langs button { all: unset; cursor: pointer; font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.05em; padding: 4px 12px; border-radius: 999px; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.langs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shop { margin-top: 22px; }
.shop ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.shop li { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 4px 16px; padding: 8px 12px; border-radius: 8px; background: var(--bg); }
.shop li span:last-child { color: var(--muted); }
@media (max-width: 560px) { .shop li { grid-template-columns: 1fr; } }
.status { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .item { transition: background .15s; } }

/* Type filter chips */
.typefilter { display: flex; gap: 6px; flex-wrap: wrap; }
.typefilter button { all: unset; cursor: pointer; font-size: 0.85rem; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.typefilter button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.typefilter button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.item .badge { display: inline-block; font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; }

/* Header icon buttons (add recipe / shopping list) */
.iconbtns { display: flex; gap: 6px; }
.iconbtn { all: unset; cursor: pointer; font-size: 0.85rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); color: var(--fg); background: var(--surface); white-space: nowrap; }
.iconbtn:hover { border-color: var(--accent); color: var(--accent); }
.iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.iconbtn .count { font-family: var(--mono); color: var(--accent); }

.upload-status { font-size: 0.85rem; padding: 8px 10px; border-radius: 8px; }
.upload-status.ok { background: var(--accent-soft); color: var(--accent); }
.upload-status.err { background: var(--warn-soft); color: var(--warn); }
.local-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.remove-local { all: unset; cursor: pointer; font-size: 0.8rem; color: var(--warn); }

/* Shopping list panel */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: flex-start; justify-content: center; padding: 10vh 16px; z-index: 20; }
.sheet-backdrop.open { display: flex; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; max-width: 440px; width: 100%; max-height: 76vh; display: flex; flex-direction: column; gap: 14px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h3 { margin: 0; }
.sheet-close { all: unset; cursor: pointer; font-size: 1.1rem; color: var(--muted); padding: 2px 6px; }
.sheet-add { display: flex; gap: 8px; }
.sheet-add input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
.sheet-add button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 8px; background: var(--accent); color: var(--surface); font-weight: 600; text-align: center; }
.shoplist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.shoplist li { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px dashed var(--line); }
.shoplist li.done span { text-decoration: line-through; color: var(--muted); }
.shoplist input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.shoplist span { flex: 1; word-break: break-word; }
.shoplist button { all: unset; cursor: pointer; color: var(--muted); font-size: 0.9rem; padding: 2px 6px; }
.shoplist button:hover { color: var(--warn); }
.sheet-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 0.85rem; }
.sheet-foot button { all: unset; cursor: pointer; color: var(--muted); }
.sheet-foot button:hover { color: var(--accent); }
.add-to-shop { all: unset; cursor: pointer; color: var(--accent); font-size: 0.78rem; margin-left: 8px; vertical-align: middle; }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="headr">
      <h1>Chut</h1>
      <div class="langs" role="group" aria-label="Language / Bahasa">
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="id" aria-pressed="false">ID</button>
      </div>
    </div>
    <div class="iconbtns">
      <button type="button" class="iconbtn" id="openShopping"><span data-i18n="shoplistBtn">Shopping list</span><span class="count" id="shopCount"></span></button>
      <button type="button" class="iconbtn" id="openUpload"><span data-i18n="addRecipeBtn">Add recipe</span></button>
      <input type="file" id="fileInput" accept="application/json,.json" hidden>
    </div>
    <p class="sub" data-i18n="tagline">Batak home cooking and baking, adapted for Prague shops.</p>
  </header>

  <div class="grid" id="grid">
    <aside class="index">
      <input class="search" id="q" type="search" placeholder="Search recipes or ingredients" aria-label="Search recipes" data-i18n-ph="search">
      <div class="typefilter" id="typefilter" role="group" aria-label="Filter by type">
        <button type="button" data-type="all" aria-pressed="true" data-i18n="fAll">All</button>
        <button type="button" data-type="savoury" aria-pressed="false" data-i18n="fSavoury">Savoury</button>
        <button type="button" data-type="sweet" aria-pressed="false" data-i18n="fSweet">Sweet</button>
      </div>
      <div class="label" data-i18n="recipes">Recipes</div>
      <div class="list" id="list"><div class="empty" data-i18n="loading">Loading recipes…</div></div>
      <div id="uploadStatus"></div>
    </aside>

    <main class="detail" id="detail">
      <div class="card"><p class="status" id="status" data-i18n="pick">Pick a recipe from the list.</p></div>
    </main>
  </div>

  <section class="tips" id="tipsWrap" hidden>
    <div class="card">
      <h3 data-i18n="kitchen">Kitchen notes</h3>
      <div class="tiplist" id="tips"></div>
    </div>
  </section>
</div>

<div class="sheet-backdrop" id="shopBackdrop">
  <div class="sheet">
    <div class="sheet-head">
      <h3 data-i18n="shoplistTitle">Shopping list</h3>
      <button type="button" class="sheet-close" id="shopClose" aria-label="Close">✕</button>
    </div>
    <form class="sheet-add" id="shopAddForm">
      <input type="text" id="shopInput" data-i18n-ph="shopAddPh" placeholder="Add an item">
      <button type="submit" data-i18n="add">Add</button>
    </form>
    <ul class="shoplist" id="shoplist"></ul>
    <div class="sheet-foot">
      <button type="button" id="shopClearDone" data-i18n="clearChecked">Clear checked</button>
      <button type="button" id="shopClearAll" data-i18n="clearAll">Clear all</button>
    </div>
  </div>
</div>

<script>
// Text is either a plain string or an [en, id] pair (same convention as C3KO).
const UI = {
  en: {
    tagline: "Batak home cooking and baking, adapted for Prague shops.",
    search: "Search recipes or ingredients", recipes: "Recipes", loading: "Loading recipes…",
    pick: "Pick a recipe from the list.", kitchen: "Kitchen notes", empty: "No recipes yet.",
    nomatch: "No recipe matches that search.", recipe: "Recipe", back: "← All recipes",
    ingredients: "Ingredients", method: "Method", notes: "Notes", shop: "Where to buy in Prague",
    servings: "servings", fewer: "Fewer servings", more: "More servings",
    loadfail: "Couldn't load the recipes. Check your connection and reload. Opening the file directly from your computer won't work; use the website or a local server.",
    fAll: "All", fSavoury: "Savoury", fSweet: "Sweet", local: "Your own",
    addRecipeBtn: "Add recipe", uploadOk: "Added “{title}” to the list.",
    uploadErr: "Couldn't read that file: {reason}", uploadDupe: "A recipe with id “{id}” is already in the list.",
    errNotJson: "that's not valid JSON", errNoId: "missing an “id” field", errNoTitle: "missing a “title” field",
    errBadType: "the file isn't a recipe object (or a {“recipes”:[...]} list of them)",
    removeLocal: "Remove", removedLocal: "Removed “{title}”.",
    shoplistBtn: "Shopping list", shoplistTitle: "Shopping list", shopAddPh: "Add an item",
    add: "Add", clearChecked: "Clear checked", clearAll: "Clear all", shopEmpty: "Nothing on the list yet.",
    addToShop: "+ list"
  },
  id: {
    tagline: "Masakan rumahan dan kue khas Batak, disesuaikan dengan bahan di Praha.",
    search: "Cari resep atau bahan", recipes: "Resep", loading: "Memuat resep…",
    pick: "Pilih resep dari daftar.", kitchen: "Catatan dapur", empty: "Belum ada resep.",
    nomatch: "Tidak ada resep yang cocok.", recipe: "Resep", back: "← Semua resep",
    ingredients: "Bahan", method: "Cara membuat", notes: "Catatan", shop: "Tempat beli di Praha",
    servings: "porsi", fewer: "Kurangi porsi", more: "Tambah porsi",
    loadfail: "Resep gagal dimuat. Cek koneksi internet lalu muat ulang. Membuka file langsung dari komputer tidak bisa; pakai situsnya atau server lokal.",
    fAll: "Semua", fSavoury: "Gurih", fSweet: "Manis", local: "Punyamu",
    addRecipeBtn: "Tambah resep", uploadOk: "“{title}” ditambahkan ke daftar.",
    uploadErr: "File tidak bisa dibaca: {reason}", uploadDupe: "Resep dengan id “{id}” sudah ada di daftar.",
    errNotJson: "bukan JSON yang valid", errNoId: "tidak ada field “id”", errNoTitle: "tidak ada field “title”",
    errBadType: "file ini bukan objek resep (atau daftar {“recipes”:[...]})",
    removeLocal: "Hapus", removedLocal: "“{title}” dihapus.",
    shoplistBtn: "Daftar belanja", shoplistTitle: "Daftar belanja", shopAddPh: "Tambah barang",
    add: "Tambah", clearChecked: "Hapus yang dicentang", clearAll: "Hapus semua", shopEmpty: "Daftar masih kosong.",
    addToShop: "+ daftar"
  }
};
const UNITS = { id: { tsp: "sdt", tbsp: "sdm", cup: "cangkir" } };
const LANG_KEY = "chut.lang";
const LOCAL_KEY = "chut.localRecipes";
const SHOP_KEY = "chut.shopping";

function detectLang() {
  try { const v = localStorage.getItem(LANG_KEY); if (v === "en" || v === "id") return v; } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("id") ? "id" : "en";
}
function loadLocal(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return Array.isArray(v) ? v : fallback; } catch (e) { return fallback; }
}
function saveLocal(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

const state = {
  recipes: [], localRecipes: loadLocal(LOCAL_KEY, []), tips: [], current: null, servings: null,
  q: "", type: "all", lang: detectLang(), failed: false, shopping: loadLocal(SHOP_KEY, [])
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L2 = (x) => Array.isArray(x) ? (state.lang === "id" ? (x[1] || x[0]) : x[0]) : (x ?? "");
const t = (k) => UI[state.lang][k] ?? UI.en[k] ?? k;
const fmt = (k, vars) => t(k).replace(/\{(\w+)\}/g, (_, n) => esc(vars[n] ?? ""));
const both = (x) => Array.isArray(x) ? x.join(" ") : (x ?? "");
const fold = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const allRecipes = () => state.recipes.concat(state.localRecipes);

function fmtAmount(a, unit) {
  if (a == null || a === "") return "";
  let v = Number(a);
  if (!isFinite(v)) return esc(a);
  if (!unit) v = Math.round(v * 2) / 2;
  else if (["tsp","tbsp","cup"].includes(unit)) v = Math.round(v * 4) / 4;
  else if (v >= 20) v = Math.round(v / 5) * 5;
  else v = Math.round(v * 10) / 10;
  const fr = { 0.25: "¼", 0.5: "½", 0.75: "¾" };
  const whole = Math.floor(v), part = +(v - whole).toFixed(2);
  let txt = fr[part] ? (whole ? whole + fr[part] : fr[part]) : String(v);
  if (state.lang === "id" && !fr[part]) txt = txt.replace(".", ",");
  const u = unit ? ((UNITS[state.lang] || {})[unit] || unit) : "";
  return u ? txt + " " + u : txt;
}

function applyStatic() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); el.setAttribute("aria-label", t(el.dataset.i18nPh)); });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
}

function sorted() {
  return allRecipes().slice().sort((a, b) => L2(a.title).localeCompare(L2(b.title), state.lang));
}

function renderList() {
  const el = $("list");
  if (state.failed) { el.innerHTML = `<div class="empty">${esc(t("loadfail"))}</div>`; return; }
  const q = fold(state.q.trim());
  const rows = sorted().filter(r => {
    if (state.type !== "all" && r.type !== state.type) return false;
    if (!q) return true;
    const hay = [r.title, r.category, r.description, ...(r.ingredients || []).map(i => i.name), ...(r.tags || [])].map(both).join(" ");
    return fold(hay).includes(q);
  });
  if (!allRecipes().length) { el.innerHTML = `<div class="empty">${esc(t("empty"))}</div>`; return; }
  if (!rows.length) { el.innerHTML = `<div class="empty">${esc(t("nomatch"))}</div>`; return; }
  el.innerHTML = rows.map(r => `<button class="item" data-id="${esc(r.id)}" aria-current="${state.current === r.id}">
      <span class="t">${esc(L2(r.title))}${r.isLocal ? `<span class="badge">${esc(t("local"))}</span>` : ""}</span>
      <span class="m">${esc([L2(r.category), L2(r.time)].filter(Boolean).join(" · "))}</span></button>`).join("");
}

function renderDetail() {
  const r = allRecipes().find(x => x.id === state.current);
  if (!r) return;
  const base = Number(r.servings) || 1;
  const s = state.servings ?? base;
  const k = s / base;
  const chips = [
    r.oven ? `<span class="chip oven">${esc(L2(r.oven))}</span>` : "",
    r.time ? `<span class="chip">${esc(L2(r.time))}</span>` : "",
    ...(r.equipment || []).map(e => `<span class="chip">${esc(L2(e))}</span>`)
  ].join("");
  const shop = Array.isArray(r.shopping) ? r.shopping : [];
  $("detail").innerHTML = `<div class="card">
    <button class="back" id="back">${esc(t("back"))}</button>
    <div class="label">${esc(L2(r.category) || t("recipe"))}${r.isLocal ? `<span class="badge">${esc(t("local"))}</span>` : ""}</div>
    <h2>${esc(L2(r.title))}</h2>
    ${r.description ? `<p class="desc">${esc(L2(r.description))}</p>` : ""}
    <div class="facts">${chips}</div>
    <div class="cols">
      <section>
        <h3>${esc(t("ingredients"))}
          <span class="serv"><button id="minus" aria-label="${esc(t("fewer"))}">−</button><output id="sv">${s}</output><button id="plus" aria-label="${esc(t("more"))}">+</button> ${esc(t("servings"))}</span>
        </h3>
        <ul class="ing">${(r.ingredients || []).map(i => `<li><span class="q">${fmtAmount(i.amount != null ? i.amount * k : null, i.unit)}</span><span>${esc(L2(i.name))}<button type="button" class="add-to-shop" data-item="${esc(L2(i.name))}">${esc(t("addToShop"))}</button></span></li>`).join("")}</ul>
        ${shop.length ? `<div class="shop"><h3>${esc(t("shop"))}</h3><ul>${shop.map(x => `<li><span>${esc(L2(x.items))}</span><span>${esc(L2(x.where))}</span></li>`).join("")}</ul></div>` : ""}
      </section>
      <section>
        <h3>${esc(t("method"))}</h3>
        <ol class="steps">${(r.steps || []).map(st => `<li><div>${st.title ? `<b>${esc(L2(st.title))}</b>` : ""}${esc(L2(st.text))}</div></li>`).join("")}</ol>
      </section>
    </div>
    ${(r.notes || []).length ? `<div class="notes"><h3>${esc(t("notes"))}</h3><ul>${r.notes.map(n => `<li>${esc(L2(n))}</li>`).join("")}</ul></div>` : ""}
    ${r.isLocal ? `<div class="local-row"><span></span><button type="button" class="remove-local" id="removeLocal">${esc(t("removeLocal"))}</button></div>` : ""}
  </div>`;
  $("minus").onclick = () => { state.servings = Math.max(1, s - 1); renderDetail(); };
  $("plus").onclick = () => { state.servings = s + 1; renderDetail(); };
  $("back").onclick = () => { $("grid").classList.remove("open"); };
  $("detail").querySelectorAll(".add-to-shop").forEach(b => b.onclick = () => addShoppingItem(b.dataset.item));
  const rmBtn = $("removeLocal"); if (rmBtn) rmBtn.onclick = () => removeLocalRecipe(r.id);
}

function renderTips() {
  $("tipsWrap").hidden = !state.tips.length;
  $("tips").innerHTML = state.tips.map(x => `<div><b>${esc(L2(x.title))}</b><span>${esc(L2(x.text))}</span></div>`).join("");
}

function renderAll() { applyStatic(); renderList(); renderDetail(); renderTips(); renderShopping(); }

/* ---- Sweet / savoury filter ---- */
function setTypeFilter(ty) {
  state.type = ty;
  $("typefilter").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.type === ty)));
  renderList();
}

/* ---- Add a recipe from a JSON file ---- */
function validateRecipe(obj) {
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) return t("errBadType");
  if (!obj.id) return t("errNoId");
  if (!obj.title) return t("errNoTitle");
  return null;
}
function showUploadStatus(msg, ok) {
  $("uploadStatus").innerHTML = `<div class="upload-status ${ok ? "ok" : "err"}">${msg}</div>`;
}
function addLocalRecipe(recipe) {
  recipe = Object.assign({}, recipe, { isLocal: true });
  if (!recipe.type) recipe.type = "savoury";
  const dupe = allRecipes().some(r => r.id === recipe.id);
  if (dupe) { showUploadStatus(fmt("uploadDupe", { id: recipe.id }), false); return; }
  state.localRecipes.push(recipe);
  saveLocal(LOCAL_KEY, state.localRecipes);
  showUploadStatus(fmt("uploadOk", { title: L2(recipe.title) }), true);
  renderList(); renderDetail();
}
function removeLocalRecipe(id) {
  const r = state.localRecipes.find(x => x.id === id);
  state.localRecipes = state.localRecipes.filter(x => x.id !== id);
  saveLocal(LOCAL_KEY, state.localRecipes);
  if (state.current === id) {
    const first = sorted()[0];
    state.current = first ? first.id : null;
    $("grid").classList.remove("open");
  }
  if (r) showUploadStatus(fmt("removedLocal", { title: L2(r.title) }), true);
  renderList(); renderDetail();
}
async function handleRecipeUpload(file) {
  let text;
  try { text = await file.text(); } catch (e) { showUploadStatus(fmt("uploadErr", { reason: t("errNotJson") }), false); return; }
  let data;
  try { data = JSON.parse(text); } catch (e) { showUploadStatus(fmt("uploadErr", { reason: t("errNotJson") }), false); return; }
  const list = Array.isArray(data) ? data : (Array.isArray(data?.recipes) ? data.recipes : [data]);
  let added = 0, lastTitle = "", firstErr = null;
  for (const obj of list) {
    const err = validateRecipe(obj);
    if (err) { firstErr = err; continue; }
    const before = state.localRecipes.length;
    addLocalRecipe(obj);
    if (state.localRecipes.length > before) { added++; lastTitle = L2(obj.title); }
  }
  if (added === 0 && firstErr) showUploadStatus(fmt("uploadErr", { reason: firstErr }), false);
  else if (added === 1) showUploadStatus(fmt("uploadOk", { title: lastTitle }), true);
}

/* ---- Shopping list ---- */
function addShoppingItem(text) {
  text = String(text || "").trim();
  if (!text) return;
  state.shopping.push({ text, done: false });
  saveLocal(SHOP_KEY, state.shopping);
  renderShopping();
}
function toggleShoppingItem(i) {
  if (!state.shopping[i]) return;
  state.shopping[i].done = !state.shopping[i].done;
  saveLocal(SHOP_KEY, state.shopping);
  renderShopping();
}
function removeShoppingItem(i) {
  state.shopping.splice(i, 1);
  saveLocal(SHOP_KEY, state.shopping);
  renderShopping();
}
function clearCheckedShopping() {
  state.shopping = state.shopping.filter(x => !x.done);
  saveLocal(SHOP_KEY, state.shopping);
  renderShopping();
}
function clearAllShopping() {
  state.shopping = [];
  saveLocal(SHOP_KEY, state.shopping);
  renderShopping();
}
function renderShopping() {
  const left = state.shopping.filter(x => !x.done).length;
  $("shopCount").textContent = left ? ` (${left})` : "";
  const el = $("shoplist");
  if (!el) return;
  if (!state.shopping.length) { el.innerHTML = `<li class="empty" style="border:none">${esc(t("shopEmpty"))}</li>`; return; }
  el.innerHTML = state.shopping.map((x, i) => `<li class="${x.done ? "done" : ""}">
      <input type="checkbox" data-i="${i}" ${x.done ? "checked" : ""} aria-label="${esc(x.text)}">
      <span>${esc(x.text)}</span>
      <button type="button" data-i="${i}" aria-label="${esc(t("removeLocal"))}">✕</button>
    </li>`).join("");
  el.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.onchange = () => toggleShoppingItem(+cb.dataset.i));
  el.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => removeShoppingItem(+b.dataset.i));
}

function openRecipe(id) {
  state.current = id; state.servings = null;
  $("grid").classList.add("open");
  try { localStorage.setItem("lastRecipe", id); } catch (e) {}
  renderList(); renderDetail();
}

$("list").addEventListener("click", e => { const b = e.target.closest(".item"); if (b) openRecipe(b.dataset.id); });
$("q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
document.querySelector(".langs").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]"); if (!b || b.dataset.lang === state.lang) return;
  state.lang = b.dataset.lang;
  try { localStorage.setItem(LANG_KEY, state.lang); } catch (err) {}
  renderAll();
});
$("typefilter").addEventListener("click", e => {
  const b = e.target.closest("button[data-type]"); if (!b) return;
  setTypeFilter(b.dataset.type);
});

/* Add-recipe upload */
$("openUpload").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (file) handleRecipeUpload(file);
});

/* Shopping list sheet */
$("openShopping").addEventListener("click", () => { $("shopBackdrop").classList.add("open"); renderShopping(); });
$("shopClose").addEventListener("click", () => $("shopBackdrop").classList.remove("open"));
$("shopBackdrop").addEventListener("click", e => { if (e.target === $("shopBackdrop")) $("shopBackdrop").classList.remove("open"); });
$("shopAddForm").addEventListener("submit", e => {
  e.preventDefault();
  addShoppingItem($("shopInput").value);
  $("shopInput").value = "";
  $("shopInput").focus();
});
$("shopClearDone").addEventListener("click", clearCheckedShopping);
$("shopClearAll").addEventListener("click", clearAllShopping);

applyStatic();
(async () => {
  try {
    const data = await (await fetch("recipes.json", {cache: "no-store"})).json();
    state.recipes = data.recipes || [];
    let last = null; try { last = localStorage.getItem("lastRecipe"); } catch (e) {}
    const hash = location.hash.slice(1);
    const pick = [hash, last].find(id => state.recipes.some(r => r.id === id));
    const first = sorted()[0];
    state.current = pick || (first && first.id);
  } catch (e) { state.failed = true; }
  try { state.tips = (await (await fetch("kitchen.json", {cache: "no-store"})).json()).tips || []; } catch (e) {}
  renderAll();
})();

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>

</body>
